# SMS Gateway 서버(Private 모드) — https://github.com/android-sms-gateway/server
# 시작: docker compose --env-file .env up -d     (deploy/gateway 에서 실행)
# 비밀값은 deploy/setup.mjs 가 만든 .env 에서 읽는다.
name: interview-sms-gateway

x-gateway-env: &gateway-env
  CONFIG_PATH: config.yml
  HTTP__LISTEN: 0.0.0.0:3000
  HTTP__PROXIES: "0.0.0.0/0"
  HTTP__API__HOST: ${GATEWAY_API_HOST}
  DATABASE__HOST: db
  DATABASE__PORT: "3306"
  DATABASE__USER: sms
  DATABASE__PASSWORD: ${GATEWAY_DB_PASSWORD}
  DATABASE__DATABASE: sms
  GATEWAY__MODE: private
  GATEWAY__PRIVATE_TOKEN: ${GATEWAY_PRIVATE_TOKEN}
  JWT__SECRET: ${GATEWAY_JWT_SECRET}
  # 서버에 쌓이는 문자 원문은 3일 후 삭제 (면접 시스템 DB 가 원본)
  TASKS__MESSAGES_CLEANUP__MAX_AGE: 72h

services:
  backend:
    image: ghcr.io/android-sms-gateway/server:latest
    environment: *gateway-env
    ports:
      - "127.0.0.1:3000:3000"   # 외부 공개는 Cloudflare Tunnel 이 담당
    volumes:
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/android-sms-gateway/server:latest
    command: ["/app/app", "worker"]
    environment: *gateway-env
    volumes:
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:lts
    environment:
      MYSQL_ROOT_PASSWORD: ${GATEWAY_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sms
      MYSQL_USER: sms
      MYSQL_PASSWORD: ${GATEWAY_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mariadb-data:

# Cloudflare Tunnel 설정 템플릿. 실제 파일은 ~/.cloudflared/interview-sms.yml 로 만든다.
# <TUNNEL_ID>, <CREDENTIALS_FILE> 을 채워서 사용: cloudflared tunnel --config <파일> run
tunnel: <TUNNEL_ID>
credentials-file: <CREDENTIALS_FILE>
ingress:
  - hostname: interview.bigbears.me     # 면접 관리 웹
    service: http://127.0.0.1:8787
  - hostname: sms.bigbears.me           # SMS 게이트웨이 서버 (폰 앱/웹훅)
    service: http://127.0.0.1:3000
  - service: http_status:404
